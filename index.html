<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morgenrot – Aufwach-Timer</title>
<meta name="theme-color" content="#04060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morgenrot">
<!--PWA-->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<!--/PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,200;9..144,400&display=swap" rel="stylesheet">
<style>
  :root {
    --night-ink: #04060f;
    --moon: #c9cfe6;
    --moon-dim: rgba(201, 207, 230, .55);
    --hill: #03050b;
    --sun: #ffcf8a;
    --rose: #e9867a;
    --text: var(--moon);
    --text-soft: var(--moon-dim);
    --serif: "Fraunces", "Iowan Old Style", "Palatino", Georgia, serif;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  /* Die App ist für die Nacht gemacht: hell und dunkel nutzen dieselbe gedämpfte Palette. */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --moon: #c9cfe6; } }
  :root[data-theme="dark"] { --moon: #c9cfe6; }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--night-ink); color: var(--text);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }

  /* ---------- Himmel ---------- */
  #sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; transition: background 2s linear; }
  #stars { position: absolute; inset: 0; transition: opacity 2s linear; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; }
  #glow {
    position: absolute; left: 50%; bottom: 18%; width: 160vmax; height: 80vmax;
    transform: translate(-50%, 50%);
    background: radial-gradient(closest-side, rgba(255, 190, 130, .9), rgba(233, 134, 122, .35) 45%, transparent 75%);
    opacity: 0; transition: opacity 2s linear;
  }
  #sun {
    position: absolute; left: 50%; bottom: 18%;
    width: min(34vmin, 260px); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #fff3d6, var(--sun) 55%, #f4a66a);
    box-shadow: 0 0 80px 30px rgba(255, 190, 120, .45);
    transform: translate(-50%, 110%); transition: transform 2s linear;
  }
  #hill { position: absolute; left: 0; right: 0; bottom: 0; height: 24%; width: 100%; }

  /* ---------- Inhalt ---------- */
  main {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column;
    padding: 4vh max(6vw, 24px) 0;
  }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.on { display: flex; }

  .clock-now { font-size: 15px; color: var(--text-soft); letter-spacing: .02em; font-variant-numeric: tabular-nums; }

  .big {
    font-family: var(--serif); font-weight: 200;
    font-size: clamp(88px, 22vmin, 220px); line-height: .9;
    font-variation-settings: "opsz" 144;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    margin: 0;
  }
  .big small { font-size: .32em; font-weight: 400; letter-spacing: 0; margin-left: .15em; color: var(--text-soft); }
  .line { font-family: var(--serif); font-size: clamp(20px, 3.4vmin, 30px); color: var(--text-soft); margin: .6em 0 0; }

  /* Einrichtung */
  #setup { justify-content: center; max-width: 34rem; }
  #setup label { font-family: var(--serif); font-size: clamp(22px, 3.6vmin, 32px); color: var(--text-soft); }
  #wakeInput {
    font: inherit; font-family: var(--serif); font-weight: 200;
    font-size: clamp(88px, 22vmin, 200px); line-height: 1;
    color: var(--text); background: transparent; border: 0; padding: 0; margin: .1em 0 .2em;
    width: 100%; max-width: 6ch; font-variant-numeric: tabular-nums;
    border-bottom: 1px solid rgba(201, 207, 230, .2);
  }
  #wakeInput::-webkit-date-and-time-value { text-align: left; }
  #wakeInput::-webkit-calendar-picker-indicator { filter: invert(.8); opacity: .5; }
  #setupInfo { color: var(--text-soft); font-size: 16px; line-height: 1.5; margin: 0 0 2em; min-height: 1.5em; }

  button {
    font: inherit; font-size: 18px; cursor: pointer;
    border-radius: 999px; padding: 16px 28px; min-height: 52px;
    border: 1px solid rgba(201, 207, 230, .35); background: transparent; color: var(--text);
  }
  button.primary { background: var(--moon); color: var(--night-ink); border-color: transparent; font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }

  /* Nacht */
  #night { justify-content: space-between; }
  #night .center { margin-top: 10vh; }
  #night .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 3vh; }
  #night .foot button { font-size: 15px; padding: 10px 18px; min-height: 44px; border-color: rgba(201, 207, 230, .18); color: var(--text-soft); }
  #lockNote { font-size: 13px; color: var(--text-soft); max-width: 22rem; line-height: 1.4; }

  /* Gedimmt: nur noch die Restzeit, ganz schwach */
  body.dimmed main { opacity: .18; transition: opacity 1s; }
  body.dimmed #sky { filter: brightness(.35); }

  /* Alarm */
  #alarm { justify-content: center; align-items: flex-start; }
  #alarm .big { color: #1d2140; }
  #alarm .line { color: rgba(29, 33, 64, .75); }
  #alarm button { border-color: rgba(29, 33, 64, .4); color: #1d2140; }
  #alarm button.primary { background: #1d2140; color: #ffe9c7; }
  #alarm .row { margin-top: 2.5em; }

  body.dawn { --text: #1d2140; --text-soft: rgba(29, 33, 64, .7); }
  body.dawn #night .foot button { border-color: rgba(29, 33, 64, .3); }

  @media (prefers-reduced-motion: reduce) {
    #sky, #sun, #glow, #stars { transition: none; }
  }
  @media (orientation: landscape) and (max-height: 600px) {
    #night .center { margin-top: 2vh; }
  }
</style>
</head>
<body>
<div id="sky" aria-hidden="true">
  <div id="stars"></div>
  <div id="glow"></div>
  <div id="sun"></div>
  <svg id="hill" viewBox="0 0 100 24" preserveAspectRatio="none">
    <path d="M0 9 C 14 4, 26 6, 38 8 S 62 3, 74 6 S 92 8, 100 5 L100 24 L0 24 Z" fill="#03050b"/>
  </svg>
</div>

<main>
  <section id="setup" class="screen" aria-labelledby="setupLabel">
    <label id="setupLabel" for="wakeInput">Aufstehen um</label>
    <input id="wakeInput" type="time" value="06:30" required>
    <p id="setupInfo"></p>
    <div class="row"><button id="startBtn" class="primary">Wecker stellen</button></div>
  </section>

  <section id="night" class="screen" aria-live="off">
    <div class="clock-now" id="nowClock"></div>
    <div class="center">
      <p class="big" id="remaining"></p>
      <p class="line" id="wakeLine"></p>
    </div>
    <div class="foot">
      <span id="lockNote">iPad am Ladekabel lassen und die App offen. Bei gesperrtem Bildschirm klingelt kein Web-Wecker.</span>
      <div class="row">
        <button id="dimBtn">Dimmen</button>
        <button id="cancelBtn">Wecker beenden</button>
      </div>
    </div>
  </section>

  <section id="alarm" class="screen" role="alert">
    <p class="big">Guten Morgen</p>
    <p class="line" id="alarmLine"></p>
    <div class="row">
      <button id="offBtn" class="primary">Wecker aus</button>
      <button id="snoozeBtn">5 Min. schlummern</button>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'morgenrot-state';
  const SNOOZE_MIN = 5;
  let state = { wake: '06:30', start: null, target: null, ringing: false };
  let audioCtx = null, alarmTimer = null, alarmStarted = 0, wakeLock = null;

  // ---------- Speicher ----------
  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.wake) state = Object.assign(state, s); } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- Zeit ----------
  const pad = n => String(n).padStart(2, '0');
  const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
  function nextOccurrence(t) {
    const [h, m] = t.split(':').map(Number);
    const d = new Date(); d.setHours(h, m, 0, 0);
    if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  function durationText(ms) {
    const totalMin = Math.round(ms / 60000);
    const h = Math.floor(totalMin / 60), m = totalMin % 60;
    if (h === 0) return m + ' Minuten';
    return h + ' Std. ' + (m ? m + ' Min.' : '');
  }
  function remainingHTML(ms) {
    if (ms < 60000) return Math.ceil(ms / 1000) + '<small>Sek.</small>';
    const totalMin = Math.ceil(ms / 60000);
    const h = Math.floor(totalMin / 60), m = totalMin % 60;
    if (h === 0) return m + '<small>Min.</small>';
    return h + ':' + pad(m) + '<small>Std.</small>';
  }

  // ---------- Himmel ----------
  const NIGHT = [[4, 6, 15], [11, 17, 48], [21, 28, 69]];
  const DAWN = [[111, 147, 214], [231, 163, 160], [255, 207, 138]];
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

  function paintSky(progress) {
    // Lange ruhige Nacht, die Dämmerung beginnt im letzten Drittel.
    const p = Math.min(1, Math.max(0, progress));
    const dawn = Math.pow(Math.max(0, (p - 0.66) / 0.34), 1.3);
    const top = mix(NIGHT[0], DAWN[0], dawn), mid = mix(NIGHT[1], DAWN[1], dawn), bot = mix(NIGHT[2], DAWN[2], dawn);
    $('sky').style.background = `linear-gradient(to bottom, ${rgb(top)} 0%, ${rgb(mid)} 55%, ${rgb(bot)} 82%)`;
    $('stars').style.opacity = String(1 - dawn);
    $('glow').style.opacity = String(Math.min(1, dawn * 1.2));
    // Sonne: von tief unter dem Horizont bis knapp darüber
    const y = 110 - 150 * Math.pow(p, 2.2);
    $('sun').style.transform = `translate(-50%, ${y}%)`;
    document.body.classList.toggle('dawn', dawn > 0.55);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = rgb(top);
  }

  function makeStars() {
    const box = $('stars');
    for (let i = 0; i < 70; i++) {
      const s = document.createElement('span');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 72 + '%';
      s.style.opacity = (0.15 + Math.random() * 0.6).toFixed(2);
      if (Math.random() < 0.15) { s.style.width = s.style.height = '3px'; }
      box.appendChild(s);
    }
  }

  // ---------- Bildschirm wach halten ----------
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) { wakeLock = null; }
  }
  function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

  // ---------- Ton ----------
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      // stummer Ton, damit iOS den Audio-Kanal freigibt
      const b = audioCtx.createBuffer(1, 1, 22050), s = audioCtx.createBufferSource();
      s.buffer = b; s.connect(audioCtx.destination); s.start(0);
    } catch (e) {}
  }
  function chime() {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // Lautstärke steigt über 60 Sekunden sanft an
    const vol = Math.min(0.9, 0.08 + (Date.now() - alarmStarted) / 60000 * 0.8);
    const now = audioCtx.currentTime;
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const t0 = now + i * 0.22;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + 1);
    });
  }
  function startAlarm() {
    if (alarmTimer) return;
    alarmStarted = Date.now();
    chime();
    alarmTimer = setInterval(chime, 1800);
  }
  function stopAlarm() { clearInterval(alarmTimer); alarmTimer = null; }

  // ---------- Bildschirme ----------
  function show(id) {
    ['setup', 'night', 'alarm'].forEach(s => $(s).classList.toggle('on', s === id));
    if (id !== 'night') document.body.classList.remove('dimmed');
  }

  function updateSetupInfo() {
    const t = nextOccurrence($('wakeInput').value || state.wake);
    $('setupInfo').textContent = 'Noch ' + durationText(t - Date.now()) + ' Schlaf, wenn du jetzt startest.';
  }

  function tick() {
    const now = Date.now();
    $('nowClock').textContent = hhmm(new Date(now));
    if (!state.target) { paintSky(0); updateSetupInfo(); return; }

    const left = state.target - now;
    const progress = (now - state.start) / (state.target - state.start);
    paintSky(progress);

    if (left <= 0) {
      if (!state.ringing) { state.ringing = true; save(); }
      $('alarmLine').textContent = 'Es ist ' + hhmm(new Date(now)) + '.';
      if (!$('alarm').classList.contains('on')) show('alarm');
      startAlarm();
      return;
    }
    $('remaining').innerHTML = remainingHTML(left);
    $('wakeLine').textContent = 'bis ' + hhmm(new Date(state.target));
  }

  // ---------- Aktionen ----------
  $('startBtn').addEventListener('click', () => {
    const v = $('wakeInput').value;
    if (!v) { $('setupInfo').textContent = 'Bitte eine Uhrzeit eintragen.'; return; }
    unlockAudio();
    state.wake = v; state.start = Date.now(); state.target = nextOccurrence(v); state.ringing = false;
    save(); requestWakeLock(); show('night'); tick();
  });

  $('cancelBtn').addEventListener('click', () => {
    state.start = state.target = null; state.ringing = false;
    save(); releaseWakeLock(); show('setup'); tick();
  });

  $('dimBtn').addEventListener('click', e => { e.stopPropagation(); document.body.classList.add('dimmed'); });
  document.addEventListener('click', e => {
    if (document.body.classList.contains('dimmed') && e.target.id !== 'dimBtn') document.body.classList.remove('dimmed');
  });

  $('offBtn').addEventListener('click', () => {
    stopAlarm();
    state.start = state.target = null; state.ringing = false;
    save(); releaseWakeLock(); show('setup'); tick();
  });

  $('snoozeBtn').addEventListener('click', () => {
    stopAlarm(); unlockAudio();
    state.start = Date.now(); state.target = Date.now() + SNOOZE_MIN * 60000; state.ringing = false;
    save(); show('night'); tick();
  });

  $('wakeInput').addEventListener('input', updateSetupInfo);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (state.target) requestWakeLock();
      tick();
    }
  });

  // ---------- Start ----------
  load();
  makeStars();
  $('wakeInput').value = state.wake;
  if (state.target) {
    show(state.target - Date.now() <= 0 ? 'alarm' : 'night');
    requestWakeLock();
    // Nach einem Neuladen braucht iOS einen Tipp, bevor Ton erlaubt ist.
    document.addEventListener('click', unlockAudio, { once: true });
  } else {
    show('setup');
  }
  tick();
  setInterval(tick, 1000);

  // Offline-Fähigkeit, wenn die App selbst gehostet wird
  if ('serviceWorker' in navigator && location.protocol === 'https:' && window.self === window.top) {
    fetch('sw.js', { method: 'HEAD' })
      .then(r => { if (r.ok) navigator.serviceWorker.register('sw.js'); })
      .catch(() => {});
  }
})();
</script>
</body>
</html>
